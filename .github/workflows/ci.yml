name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  web-test:
    name: Web — Lint, Type-check & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: taskpass
          POSTGRES_DB: taskmanagement_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://taskuser:taskpass@localhost:5432/taskmanagement
      TEST_DATABASE_URL: postgresql://taskuser:taskpass@localhost:5433/taskmanagement_test
      NEXTAUTH_SECRET: ci-test-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3000
      FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --workspace=apps/web

      # Must run before lint and type-check so @prisma/client types exist
      - name: Generate Prisma client
        working-directory: apps/web
        run: npx prisma generate

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Type check
        run: npm run type-check --workspace=apps/web

      - name: Run unit tests (includes Android API contract tests)
        run: npm run test --workspace=apps/web

  web-e2e:
    name: Web — E2E Tests
    runs-on: ubuntu-latest
    needs: web-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: taskpass
          POSTGRES_DB: taskmanagement
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://taskuser:taskpass@localhost:5432/taskmanagement
      NEXTAUTH_SECRET: ci-e2e-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --workspace=apps/web

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        working-directory: apps/web
        run: npx prisma generate

      - name: Run database migrations
        working-directory: apps/web
        run: npx prisma db push

      - name: Build app
        run: npm run build --workspace=apps/web

      - name: Copy static assets for standalone server
        working-directory: apps/web
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Run E2E tests
        run: npm run test:e2e --workspace=apps/web

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  android-contract:
    name: Android — Contract Tests (model parsing)
    runs-on: ubuntu-latest
    # Runs in parallel with web-test for fast contract-breakage detection

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android contract unit tests
        working-directory: apps/android
        run: gradle :app:testDebugUnitTest --no-daemon --tests "com.taskflow.android.contract.*"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-contract-test-results
          path: apps/android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  android-build:
    name: Android — Build & Full Unit Tests
    runs-on: ubuntu-latest
    needs: android-contract

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: apps/android
        run: gradle assembleDebug --no-daemon

      - name: Run all unit tests
        working-directory: apps/android
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  web-production-build:
    name: Web — Production Build (on merge)
    runs-on: ubuntu-latest
    needs: [web-test, web-e2e]
    # Only runs when code lands on main/master, not on PRs
    if: github.event_name == 'push'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: taskpass
          POSTGRES_DB: taskmanagement
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://taskuser:taskpass@localhost:5432/taskmanagement
      NEXTAUTH_SECRET: ci-production-build-secret
      NEXTAUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --workspace=apps/web

      - name: Generate Prisma client
        working-directory: apps/web
        run: npx prisma generate

      - name: Run database migrations
        working-directory: apps/web
        run: npx prisma migrate deploy

      - name: Build production app
        run: npm run build --workspace=apps/web

      - name: Build Docker image
        working-directory: apps/web
        run: |
          docker build -t taskflow:${{ github.sha }} .
          docker tag taskflow:${{ github.sha }} taskflow:latest

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: apps/web/.next/standalone/
          retention-days: 30
